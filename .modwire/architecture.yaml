boundaries:
  tags:
    - {name: package, match: src/sirenity}
    - {
        name: &context_tag context,
        match: src/sirenity/contexts/*/__init__.py,
      }
    - {
        name: &module_tag module,
        match: src/sirenity/contexts/*/*,
        excluded_patterns: [src/sirenity/contexts/*/__init__.py],
      }
    - {name: &api_tag api, match: src/sirenity/api}
    - {name: &tests_tag tests, match: tests}
    - {name: scripts, match: scripts}
    - {name: &contracts_tag contracts, match: src/sirenity/contexts/*/*/contracts}
    - {name: &services_tag services, match: src/sirenity/contexts/*/*/services}
    - {name: &state_tag state, match: src/sirenity/contexts/*/*/state}
    - {name: &values_tag values, match: src/sirenity/contexts/*/*/values}

  flow:
    analyzers: [backward-flow, no-cycles, no-reentry]
    realms:
      - {name: api, module_tag: *api_tag}
      - {name: tests, module_tag: *tests_tag}
      - name: modules
        module_tag: *module_tag
        layers: [*services_tag, *state_tag, *contracts_tag, *values_tag]

shape:
  realms:
    - name: project
      match: "src/sirenity/*"
      shape:
        max_classes_per_file: -1
        max_interfaces_per_file: -1
        max_types_per_file: -1
        max_abstract_classes_per_file: -1
        max_functions_per_file: 1
        allow_optional_function_args: true
        allow_optional_method_args: true
        allow_optional_class_properties: true
