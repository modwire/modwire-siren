boundaries:
  tags:
    - {name: &module_tag module, match: src/modwire_siren/*, excluded_patterns: [src/modwire_siren/__init__.py, src/modwire_siren/_version.py, src/modwire_siren/wiring.py, src/modwire_siren/api, src/modwire_siren/shared]}
    - {name: tracked, match: "*"}

  flow:
    analyzers: [backward-flow, no-cycles, no-reentry]
    module_tag: *module_tag

shape:
  realms:
    - name: project
      match: "src/modwire_siren/*"
      shape:
        max_classes_per_file: -1
        max_interfaces_per_file: -1
        max_types_per_file: -1
        max_abstract_classes_per_file: -1
        max_functions_per_file: 1
        allow_optional_function_args: true
        allow_optional_method_args: true
        allow_optional_class_properties: true
